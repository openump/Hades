# Optional static-ACL control-plane reference. The secure Compose profile uses
# config/broker/security/roles.json instead; never combine anonymous dev access
# with these identities. Username must come from verified client certificates.
# Default deny: list only exact approved asset scopes, never openump/v1/#.
user command-proposer
topic write openump/v1/acme/berlin/assembly/line-01/press-04/command/+
topic read openump/v1/acme/berlin/assembly/line-01/press-04/command_receipt/+

user hades-actuator
topic read openump/v1/acme/berlin/assembly/line-01/press-04/command/+
topic write openump/v1/acme/berlin/assembly/line-01/press-04/command_receipt/+
topic read openump/v1/acme/berlin/assembly/line-01/press-04/telemetry

user hades-infer
# Edge AI sidecar (Hades-035/036): reads telemetry, publishes inference events and derived values.
# No command or receipt access. Soft sensors use their own derived/+ subtree, never telemetry.
topic read openump/v1/acme/berlin/assembly/line-01/press-04/telemetry
topic write openump/v1/acme/berlin/assembly/line-01/press-04/event/+
topic write openump/v1/acme/berlin/assembly/line-01/press-04/derived/+

user consumer-primary
# Explicit opt-in to inference events; the one-level asset wildcard does not match them.
topic read openump/v1/acme/berlin/assembly/line-01/press-04/event/+
topic read openump/v1/acme/berlin/assembly/line-01/press-04/derived/+

user hades-mcp
# Industrial MCP (Hades-034): reads telemetry and status, proposes commands only
# through hades-actuator's gates. Its distinct signing origin must be allowlisted
# per asset in the actuation policy before any proposal is acted on.
topic read openump/v1/acme/berlin/assembly/line-01/press-04/telemetry
topic read openump/v1/acme/berlin/assembly/line-01/press-04/status
topic write openump/v1/acme/berlin/assembly/line-01/press-04/command/+
topic read openump/v1/acme/berlin/assembly/line-01/press-04/command_receipt/+

user normalizer
topic write openump/v1/acme/berlin/assembly/line-01/press-04/telemetry
topic write openump/v1/acme/berlin/assembly/line-01/press-04/metadata
topic write openump/v1/acme/berlin/assembly/line-01/press-04/status

user gateway-press-04
# HTTP ingress only; no MQTT topic grants.

user history-adapter
topic read openump/v1/acme/berlin/assembly/line-01/press-04/telemetry

user transfer-adapter
topic read openump/v1/acme/berlin/assembly/line-01/press-04/telemetry
topic read openump/v1/acme/berlin/assembly/line-01/press-04/metadata
topic read openump/v1/acme/berlin/assembly/line-01/press-04/status
