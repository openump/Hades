name: Contract conformance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: go1.27.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Verify modules and formatting
        run: |
          go mod verify
          test -z "$(gofmt -l internal cmd)"
          git diff --check
      - name: Go checks
        run: |
          go vet ./...
          go test -race ./...
          ./scripts/check-contracts
      - name: Python development reference
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - name: Build Linux targets without cgo
        run: |
          for tool in hades-check hades-simulator hades-consumer hades-normalizer hades-history hades-pki hades-history-proxy hades-gateway; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "artifacts/$tool-amd64" "./cmd/$tool"
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "artifacts/$tool-arm64" "./cmd/$tool"
          done
      - name: Reachable Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: hades-ci-broker
      HADES_MQTT_PORT: '18883'
      HADES_VM_PORT: '18428'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - name: Install independent development validator
        run: python -m pip install -r requirements-dev.txt
      - name: Start pinned broker and verify restart
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml up --build -d --wait --wait-timeout 60
          ./scripts/smoke-broker
          docker compose -f deploy/compose.yaml port broker 1883
          python3 -c 'import os,socket; s=socket.create_connection(("127.0.0.1",int(os.environ["HADES_MQTT_PORT"])),timeout=3); s.close(); print("host-published MQTT port reachable")'
      - name: Simulated observations and validating consumer
        run: ./scripts/smoke-simulator
      - name: Raw normalization and quarantine
        run: ./scripts/smoke-normalization
      - name: Numeric history and outage recovery
        run: ./scripts/smoke-history
      - name: Independent consumer stack
        run: ./scripts/smoke-stack
      - name: Broker logs
        if: always()
        run: docker compose -f deploy/compose.yaml --profile history logs broker historian
      - name: Remove disposable CI stack
        if: always()
        run: docker compose -f deploy/compose.yaml --profile history down -v

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: hades-ci-security
      HADES_SECURE_MQTT_PORT: '18884'
      HADES_SECURE_HISTORY_PORT: '18430'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: mTLS identities, ACL denials, management isolation and rotation
        run: ./scripts/smoke-security
      - name: Pinned Telegraf lab gateway through TLS to history
        run: |
          curl -fsSL https://dl.influxdata.com/telegraf/releases/telegraf-1.40.2_linux_amd64.tar.gz -o "$RUNNER_TEMP/telegraf.tar.gz"
          echo 'fcdc579a09227fa3e2e3e208d3cf75cfd03d42ae141a4b23b18659a94428bfa3  '"$RUNNER_TEMP/telegraf.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/telegraf"
          tar -xzf "$RUNNER_TEMP/telegraf.tar.gz" -C "$RUNNER_TEMP/telegraf"
          HADES_TELEGRAF_BINARY="$RUNNER_TEMP/telegraf/telegraf-1.40.2/usr/bin/telegraf" ./scripts/smoke-ot-gateway
      - name: Remove disposable security stack
        if: always()
        env:
          HADES_SECURITY_DIR: /tmp/hades-security-cleanup
        run: docker compose -f deploy/compose.secure.yaml down -v

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HADES_RECOVERY_STACK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Isolated crash, capacity and blocked-consumer matrix
        run: ./scripts/run-recovery
      - name: Measured ID ledger
        if: always()
        run: |
          test ! -f artifacts/recovery/report.json || cat artifacts/recovery/report.json
          test ! -f artifacts/recovery/blocked-consumer.jsonl || cat artifacts/recovery/blocked-consumer.jsonl
