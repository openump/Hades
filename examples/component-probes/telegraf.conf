[agent]
  omit_hostname = true
[[inputs.modbus]]
  name = "hades_probe"
  controller = "tcp://127.0.0.1:${HADES_PROBE_MODBUS_PORT}"
  slave_id = 1
  timeout = "1s"
  configuration_type = "register"
  holding_registers = [
    { name = "temperature", byte_order = "AB", data_type = "UFIXED", scale = 0.1, address = [0] }
  ]
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
