# Hardened single-site reference: no plaintext or HTTP control listener.
listener 8883 0.0.0.0
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /credentials/broker/ca.crt
certfile /credentials/broker/broker.crt
keyfile /credentials/broker/broker.key
tls_version tlsv1.2
plugin /usr/local/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /credentials/broker/roles.json
enable_control_api false
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 4096
max_queued_bytes 16777216
max_inflight_messages 20
max_packet_size 70000
message_size_limit 65536
global_max_clients 128
log_dest stdout
log_type error
log_type warning
connection_messages true
