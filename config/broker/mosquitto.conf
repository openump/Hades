# Loopback-published development profile; production identity/TLS is Hades-013.
listener 1883 0.0.0.0
allow_anonymous true
acl_file /mosquitto/config/dev.acl
enable_control_api false
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
autosave_on_changes false
max_queued_messages 4096
max_queued_bytes 16777216
max_inflight_messages 20
max_packet_size 70000
message_size_limit 65536
global_max_clients 128
log_dest stdout
log_type error
log_type warning
connection_messages true
